
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create User | Supply Chain Analytics</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .card {
            width: 100%;
            max-width: 460px;
            padding: 30px;
            border-radius: 14px;
            background: white;
            box-shadow: 0 8px 28px rgba(15, 23, 42, .1);
        }

        h1 { color: #1e293b; font-size: 25px; }
        p { color: #64748b; }

        label {
            display: block;
            margin: 17px 0 7px;
            font-weight: bold;
            color: #334155;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        button, .back {
            display: inline-block;
            padding: 12px 16px;
            margin-top: 20px;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            width: 100%;
            background: #2563eb;
            color: white;
            font-weight: bold;
        }

        .back {
            background: #e2e8f0;
            color: #1e293b;
        }

        .message {
            padding: 11px;
            margin: 12px 0;
            border-radius: 7px;
        }

        .success { background: #dcfce7; color: #166534; }
        .error { background: #fee2e2; color: #991b1b; }
    </style>
</head>

<body>
<div class="card">
    <h1>Create User Account</h1>
    <p>Add an authorized Manager or Analyst.</p>

    <div th:if="${successMessage}" class="message success"
         th:text="${successMessage}"></div>

    <div th:if="${errorMessage}" class="message error"
         th:text="${errorMessage}"></div>

    <form th:action="@{/admin/users/create}" method="post">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName"
               maxlength="100" required>

        <label for="username">Username</label>
        <input type="text" id="username" name="username"
               minlength="3" maxlength="50" required>

        <label for="password">Temporary Password</label>
        <input type="password" id="password" name="password"
               minlength="8" autocomplete="new-password" required>

        <label for="role">Select Role</label>
        <select id="role" name="role" required>
            <option value="MANAGER">Manager</option>
            <option value="ANALYST">Analyst</option>
        </select>

        <button type="submit">Create Account</button>
    </form>

    <a class="back" th:href="@{/}">Back to Dashboard</a>
</div>
</body>
</html>
