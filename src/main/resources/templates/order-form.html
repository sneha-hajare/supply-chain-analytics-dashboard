
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 550px;
            margin: 30px auto;
            padding: 20px;
            background: #f1f5f9;
        }

        form {
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        a {
            margin-left: 10px;
        }
    </style>
</head>

<body>

<h1 th:text="${editMode} ? 'Edit Supply Order' : 'Create Supply Order'">
    Create Supply Order
</h1>

<form th:action="${editMode} ?
        @{/orders/update/{id}(id=${order.id})} :
        @{/orders/save}"
      th:object="${order}"
      method="post">

    <label>Product Name</label>
    <input type="text" th:field="*{productName}" required>

    <label>Quantity</label>
    <input type="number" th:field="*{quantity}" min="1" required>

    <label>Total Cost (₹)</label>
    <input type="number" th:field="*{totalCost}"
           min="0" step="0.01" required>

    <label>Supplier Name</label>
    <input type="text" th:field="*{supplierName}" required>

    <label>Order Date</label>
    <input type="date" th:field="*{orderDate}" required>

    <label>Status</label>
    <select th:field="*{status}" required>
        <option value="Pending">Pending</option>
        <option value="Processing">Processing</option>
        <option value="Shipped">Shipped</option>
        <option value="Delivered">Delivered</option>
        <option value="Cancelled">Cancelled</option>
    </select>

    <button type="submit"
            th:text="${editMode} ? 'Update Order' : 'Save Order'">
        Save Order
    </button>

    <a th:href="@{/orders}">Cancel</a>
</form>

</body>
</html>
