
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f7fb;
            color: #222;
        }

        h1 {
            color: #243b64;
        }

        .add-button {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 16px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #243b64;
            color: white;
        }

        .edit-button {
            color: #2563eb;
            margin-right: 10px;
        }

        .delete-button {
            color: #dc2626;
        }
    </style>
</head>
<body>

<h1>Supplier Management</h1>

<a class="add-button" th:href="@{/suppliers/new}">
    + Add Supplier
</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Contact Person</th>
        <th>Email</th>
        <th>Location</th>
        <th>Rating</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="supplier : ${suppliers}">
        <td th:text="${supplier.id}"></td>
        <td th:text="${supplier.supplierName}"></td>
        <td th:text="${supplier.contactPerson}"></td>
        <td th:text="${supplier.email}"></td>
        <td th:text="${supplier.location}"></td>
        <td th:text="${supplier.rating}"></td>

        <td>
            <a class="edit-button"
               th:href="@{/suppliers/edit/{id}(id=${supplier.id})}">
                Edit
            </a>

            <a class="delete-button"
               th:href="@{/suppliers/delete/{id}(id=${supplier.id})}"
               onclick="return confirm('Delete this supplier?')">
                Delete
            </a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
