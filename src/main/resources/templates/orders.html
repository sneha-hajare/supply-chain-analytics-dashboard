
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f1f5f9;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #0f172a;
            color: white;
        }

        a, button {
            padding: 8px 12px;
            cursor: pointer;
        }

        .edit {
            color: white;
            background: #2563eb;
            text-decoration: none;
            border-radius: 4px;
        }

        .delete-button {
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 4px;
        }
    </style>
</head>

<body>

<h1>Order Management</h1>

<div class="card">
    <a th:href="@{/orders/new}">Create Order</a>
    <a th:href="@{/}">Dashboard</a>
</div>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Product</th>
        <th>Quantity</th>
        <th>Total Cost (₹)</th>
        <th>Supplier</th>
        <th>Order Date</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="order : ${orders}">
        <td th:text="${order.id}"></td>
        <td th:text="${order.productName}"></td>
        <td th:text="${order.quantity}"></td>
        <td th:text="${order.totalCost}"></td>
        <td th:text="${order.supplierName}"></td>
        <td th:text="${order.orderDate}"></td>
        <td th:text="${order.status}"></td>

        <td>
            <a class="edit"
               th:href="@{/orders/edit/{id}(id=${order.id})}">
                Edit
            </a>

            <form th:action="@{/orders/delete/{id}(id=${order.id})}"
                  method="post"
                  style="display:inline"
                  onsubmit="return confirm('Delete this order?')">

                <button class="delete-button" type="submit">
                    Delete
                </button>
            </form>
        </td>
    </tr>

    <tr th:if="${#lists.isEmpty(orders)}">
        <td colspan="8">No orders found.</td>
    </tr>
    </tbody>
</table>

</body>
</html>
